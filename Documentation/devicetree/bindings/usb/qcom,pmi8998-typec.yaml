%YAML 1.2
---
$id: http://devicetree.org/schemas/usb/qcom,pmi8998-typec.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qualcomm PMI8998 USB Type-C and PD PHY

maintainers:
  - Ankur Verma <ankur.verma@outlook.com>

description:
  The PMI8998 charger's USBIN Type-C block (CC detection, VCONN, role control)
  together with the PMIC's USB Power Delivery PHY, which is the same as the
  one in PM8150B.

properties:
  compatible:
    const: qcom,pmi8998-typec

  connector:
    type: object
    $ref: /schemas/connector/usb-connector.yaml#
    unevaluatedProperties: false

  reg:
    items:
      - description: Type-C register base offset
      - description: PD PHY register base offset

  interrupts:
    items:
      - description: Type-C change (CC state, debounce done, VBUS)
      - description: PD signal TX - HardReset or CableReset signal TX
      - description: PD signal RX - HardReset or CableReset signal RX
      - description: PD TX complete
      - description: PD RX complete
      - description: PD TX fail
      - description: PD TX message discard
      - description: PD RX message discard

  interrupt-names:
    items:
      - const: type-c-change
      - const: sig-tx
      - const: sig-rx
      - const: msg-tx
      - const: msg-rx
      - const: msg-tx-failed
      - const: msg-tx-discarded
      - const: msg-rx-discarded

  vdd-pdphy-supply:
    description: VDD regulator supply to the PD PHY.

required:
  - compatible
  - reg
  - interrupts
  - interrupt-names
  - vdd-pdphy-supply
  - connector

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/irq.h>
    #include <dt-bindings/usb/pd.h>

    pmic {
        #address-cells = <1>;
        #size-cells = <0>;

        typec@1300 {
            compatible = "qcom,pmi8998-typec";
            reg = <0x1300>, <0x1700>;
            interrupts = <0x2 0x13 0x7 IRQ_TYPE_EDGE_RISING>,
                         <0x2 0x17 0x0 IRQ_TYPE_EDGE_RISING>,
                         <0x2 0x17 0x1 IRQ_TYPE_EDGE_RISING>,
                         <0x2 0x17 0x2 IRQ_TYPE_EDGE_RISING>,
                         <0x2 0x17 0x3 IRQ_TYPE_EDGE_RISING>,
                         <0x2 0x17 0x4 IRQ_TYPE_EDGE_RISING>,
                         <0x2 0x17 0x5 IRQ_TYPE_EDGE_RISING>,
                         <0x2 0x17 0x6 IRQ_TYPE_EDGE_RISING>;
            interrupt-names = "type-c-change",
                              "sig-tx",
                              "sig-rx",
                              "msg-tx",
                              "msg-rx",
                              "msg-tx-failed",
                              "msg-tx-discarded",
                              "msg-rx-discarded";
            vdd-pdphy-supply = <&vreg_l24a_3p075>;

            connector {
                compatible = "usb-c-connector";
                power-role = "sink";
                data-role = "dual";
                self-powered;
                sink-pdos = <PDO_FIXED(5000, 3000, PDO_FIXED_DUAL_ROLE |
                                                   PDO_FIXED_USB_COMM)>;
                op-sink-microwatt = <10000000>;
                vbus-supply = <&pmi8998_vbus>;
            };
        };
    };
...

%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/qcom/qcom,msm8998-gfx-mem-acc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qualcomm MSM8998 GFX memory accelerator select

maintainers:
  - Ankur Verma <ankur.verma@outlook.com>

description:
  The memories on the MSM8998 graphics rail (VDD_GFX) have a memory
  accelerator (mem-acc) select bit in TCSR. Qualcomm's GFX CPR driver sets
  it to 1 for the 180-342 MHz GPU voltage corners and to 0 for the
  414-710 MHz corners, raising VDD_GFX before it selects 0 and selecting 1
  before it lowers VDD_GFX. Without a GFX CPR driver, a board that runs
  VDD_GFX at a fixed voltage at or above the 414 MHz corner voltage enables
  this node to select 0 at boot, which the GPU needs at 414 MHz and above.

properties:
  compatible:
    const: qcom,msm8998-gfx-mem-acc

  qcom,tcsr:
    $ref: /schemas/types.yaml#/definitions/phandle-array
    items:
      - items:
          - description: phandle to the TCSR syscon
          - description: offset of the GFX mem-acc select register
    description: TCSR register holding the GFX mem-acc select bit (bit 0)

required:
  - compatible
  - qcom,tcsr

additionalProperties: false

examples:
  - |
    gfx-mem-acc {
        compatible = "qcom,msm8998-gfx-mem-acc";
        qcom,tcsr = <&tcsr_regs_2 0xf004>;
    };
